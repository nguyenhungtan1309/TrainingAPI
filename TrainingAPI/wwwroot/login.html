<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ Thống Trò Chuyện</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        chatPrimary: '#6366f1',
                        chatPrimaryHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 h-screen w-screen flex items-center justify-center font-sans antialiased text-slate-200 selection:bg-indigo-500 selection:text-white relative overflow-hidden">

    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md shadow-2xl p-8 z-10 relative">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-600/30 mb-4">
                <i class="fa-solid fa-comments text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-100">Đăng nhập</h2>
            <p class="text-sm text-slate-400 mt-2">Hệ thống Trò chuyện Trực tuyến Nội bộ</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <!-- Box báo lỗi -->
            <div id="errorMessage" class="hidden bg-rose-500/10 border border-rose-500/50 text-rose-400 text-sm p-3 rounded-xl text-center font-medium"></div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 block">Tên đăng nhập</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="username" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition"
                           placeholder="Nhập tên đăng nhập...">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 block">Mật khẩu</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input type="password" id="password" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition"
                           placeholder="Nhập mật khẩu...">
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full py-3 mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center group">
                <span>Đăng nhập vào hệ thống</span>
                <i class="fa-solid fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>
    </div>

    <!-- Script Xử lý Đăng nhập -->
    <script>
        // Điều hướng thẳng vào chat nếu đã có token tồn tại
        if (sessionStorage.getItem("jwtToken")) {
            window.location.href = "/chat";
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const errorBox = document.getElementById("errorMessage");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !password) return;

            // Đổi trạng thái nút
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            errorBox.classList.add("hidden");

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // CẬP NHẬT: Lưu cả jwtToken và refreshToken
                    sessionStorage.setItem("jwtToken", data.token);
                    sessionStorage.setItem("refreshToken", data.refreshToken);
                    sessionStorage.setItem("userId", data.userId);
                    sessionStorage.setItem("username", data.username);
                    sessionStorage.setItem("displayName", data.displayName);
                    sessionStorage.setItem("avatarUrl", data.avatarUrl || "");

                    // Điều hướng
                    window.location.href = "/chat";
                } else {
                    showError(data.message || "Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin.");
                    resetButton();
                }
            } catch (err) {
                console.error(err);
                showError("Không thể kết nối đến máy chủ. Vui lòng thử lại sau.");
                resetButton();
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById("errorMessage");
            errorBox.innerText = msg;
            errorBox.classList.remove("hidden");
        }

        function resetButton() {
            const btn = document.getElementById("loginBtn");
            btn.disabled = false;
            btn.innerHTML = '<span>Đăng nhập vào hệ thống</span><i class="fa-solid fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>';
        }
    </script>
</body>
</html>
